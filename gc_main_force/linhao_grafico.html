  const d = document.createElement('div');
  d.className = 'item';
  d.innerHTML = '<span class="sw' + (lv.dash ? ' dash' : '') + '" style="border-top-color:' + lv.color + '"></span>'

  legend.appendChild(d);
});
const series = DATA.series;
const primeiro = series.find(row => row[1] != null);
const ultimo = [...series].reverse().find(row => row[1] != null);

document.getElementById('lastmeta').textContent =

  + '   ' + ultimo[0].slice(11);

  'Pregão ' + primeiro[0].slice(0, 10) + '  ' + primeiro[0].slice(11) + ' → ' + ultimo[0].slice(11)
  + '   ontem ' + DATA.yesterday + '   linhão ' + DATA.linhao;

const pontos = [];
let anterior = 0;
series.forEach(row => {
  const time = Math.floor(Date.parse(row[0] + 'Z') / 1000);
  if (time <= anterior) return;
  anterior = time;
  if (row[1] == null) pontos.push({ time: time });
  else pontos.push({ time: time, value: row[1] });
});

let modo = 'pregao';
const chart = LightweightCharts.createChart(document.getElementById('chart'), {

  localization: { priceFormatter: function (preco) { return preco.toFixed(2); } },
});

  priceLineVisible: true,
  lastValueVisible: true,

  autoscaleInfoProvider: function (original) {
    const base = original();
    if (!base || !base.priceRange || modo === 'pregao') return base;
    let minV = base.priceRange.minValue;
    let maxV = base.priceRange.maxValue;
    DATA.levels.forEach(function (lv) {
      if (lv.price < minV) minV = lv.price;
      if (lv.price > maxV) maxV = lv.price;
    });
    const pad = Math.max(1, (maxV - minV) * 0.04);
    return { priceRange: { minValue: minV - pad, maxValue: maxV + pad } };
  },
});
linha.setData(pontos);
DATA.levels.forEach(function (lv) {
  linha.createPriceLine({

    color: lv.color,
    lineWidth: 1,

    axisLabelVisible: true,
    title: lv.name,
  });
});
function enquadrar() {
  chart.priceScale('right').applyOptions({ autoScale: false });
  chart.priceScale('right').applyOptions({ autoScale: true });
  chart.timeScale().fitContent();
}
document.getElementById('chart').addEventListener('dblclick', function () { modo = 'pregao'; enquadrar(); });
document.getElementById('bHoje').addEventListener('click', function () { modo = 'pregao'; enquadrar(); });
